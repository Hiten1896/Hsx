<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-label="Hsx mobile chat layout at 360 pixels wide">
  <defs>
    <style>
      .bg { fill: #111513; }
      .panel { fill: #171c19; }
      .surface { fill: #1c231e; }
      .raised { fill: #242d28; }
      .border { stroke: #303a34; }
      .text { fill: #edf2eb; font: 600 13px 'Segoe UI', sans-serif; }
      .muted { fill: #9aa79d; font: 500 10px 'Segoe UI', sans-serif; }
      .accent { fill: #b2d8b7; }
      .green { fill: #87c99a; }
    </style>
  </defs>
  <rect class="bg" width="360" height="640"/>
  <rect class="panel border" width="360" height="58" stroke-width="1"/>
  <rect x="14" y="12" width="34" height="34" rx="10" fill="#263129" stroke="#516553"/>
  <path d="M22 20v18m0-9h13m0-9v18m5-18v18" fill="none" stroke="#b2d8b7" stroke-width="3" stroke-linecap="round"/>
  <text class="text" x="57" y="32">Chat</text>
  <text class="muted" x="57" y="45">A private workspace assistant</text>
  <text class="muted" x="264" y="33">Provider standby</text>
  <circle class="green" cx="339" cy="31" r="4"/>
  <text class="muted" x="112" y="106" text-anchor="middle" style="font: 8px monospace; letter-spacing: 1.4px;">YOUR LOCAL WORKSPACE</text>
  <text class="text" x="180" y="151" text-anchor="middle" style="font-size: 23px;">What would you like</text>
  <text class="text" x="180" y="180" text-anchor="middle" style="font-size: 23px;">to work on?</text>
  <text class="muted" x="180" y="204" text-anchor="middle">Ask, explore a file, or create something useful.</text>
  <rect class="surface border" x="14" y="230" width="332" height="40" rx="10" stroke-width="1"/>
  <text class="muted" x="27" y="255">What is on this machine?</text>
  <rect class="surface border" x="14" y="278" width="332" height="40" rx="10" stroke-width="1"/>
  <text class="muted" x="27" y="303">Search my workspace</text>
  <rect class="surface border" x="14" y="326" width="332" height="40" rx="10" stroke-width="1"/>
  <text class="muted" x="27" y="351">Summarize a file</text>
  <rect class="surface border" x="14" y="374" width="332" height="40" rx="10" stroke-width="1"/>
  <text class="muted" x="27" y="399">Make a report</text>
  <rect class="surface border" x="10" y="492" width="340" height="92" rx="15" stroke-width="1"/>
  <circle cx="31" cy="530" r="16" fill="#242d28" stroke="#455147"/>
  <text class="text" x="31" y="535" text-anchor="middle" style="font-size: 19px;">+</text>
  <text class="muted" x="57" y="526">Message Hsx…</text>
  <rect class="accent" x="273" y="512" width="64" height="38" rx="10"/>
  <text x="305" y="535" text-anchor="middle" fill="#18211a" style="font: 700 11px 'Segoe UI', sans-serif;">Send ↑</text>
  <text class="muted" x="258" y="569" text-anchor="end" style="font-size: 8px;">Text files up to 1 MB</text>
  <text class="muted" x="180" y="607" text-anchor="middle" style="font-size: 8px;">Hsx runs on your host. Files stay in its workspace.</text>
</svg>
