<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fcf9f5"><title>Hsx</title><link rel="icon" href="favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body><main class="workspace" id="workspace">
<aside class="sidebar" id="sidebar"><div class="brand"><img src="favicon.svg" alt="Hsx"><strong>Hsx</strong><button id="sidebar-close" aria-label="Close sidebar">‹</button></div><button class="new-chat" id="new-chat">＋ New Chat <kbd>Ctrl K</kbd></button><nav><button class="active">◌ Chats</button><button id="skills-button">✦ Skills</button><button id="memory-button">▦ Memory</button></nav><section class="threads"><label>RECENT CHATS</label><div id="chat-list"></div></section></aside>
<section class="main"><header><div class="title"><button id="sidebar-open" aria-label="Open sidebar">☰</button><div><label>HSX WORKSPACE</label><h1 id="chat-title">New Chat</h1></div><button id="title-menu" aria-label="Chat actions">⋯</button></div><button id="artifact-open" aria-label="Open artifacts">▣</button></header><section class="conversation" id="conversation"><div class="welcome" id="welcome"><div class="logo"><img src="favicon.svg" alt="Hsx"></div><h2>Start a new chat</h2><p>Ask the local agent to work with your files, create an artifact, or save project context.</p></div></section><footer><form id="chat-form"><button type="button" id="attach" aria-label="Attach file">＋</button><input id="file" type="file" hidden><input id="message" placeholder="Ask the local agent anything..." autocomplete="off"><button type="submit" aria-label="Send">➤</button></form></footer></section>
<aside class="artifacts" id="artifacts"><div class="artifacts-head"><div><label>ARTIFACTS</label><h2 id="artifact-count">No artifacts</h2></div><button id="artifact-expand" aria-label="Expand artifacts">⤢</button><button id="artifact-close" aria-label="Close artifacts">›</button></div><div class="artifact-body"><div class="empty-artifact" id="empty-artifact">◇<strong>Your work will appear here.</strong><small>Generated files will be listed after the agent creates them.</small></div><label>GENERATED FILES</label><div id="files"><small>No generated files yet.</small></div><label class="memory-label">AGENT MEMORY</label><button class="memory" id="memory">▦ <span>Project memory<small>Click to add context</small></span></button><div id="facts"></div></div><div class="resize" id="resize" role="separator" tabindex="0" aria-label="Resize artifacts"></div></aside></main><div id="modal-root"></div><script src="build/script.js"></script></body></html>
