<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10130F"/>
      <stop offset="1" stop-color="#070907"/>
    </linearGradient>
    <linearGradient id="green" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DFFAF"/>
      <stop offset="1" stop-color="#00C97D"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg2)"/>

  <!-- Bracket-style H: two vertical strokes like [ ] terminal marks -->
  <g fill="url(#green)">
    <!-- Left vertical bar -->
    <rect x="150" y="140" width="46" height="232" rx="10"/>
    <!-- Right vertical bar -->
    <rect x="316" y="140" width="46" height="232" rx="10"/>
    <!-- Crossbar as a blinking cursor block -->
    <rect x="196" y="234" width="120" height="44" rx="8"/>
  </g>

  <!-- x mark as execution/close cross, bottom right, terminal-cursor style -->
  <g stroke="#3DFFAF" stroke-width="26" stroke-linecap="round">
    <line x1="360" y1="360" x2="404" y2="404"/>
    <line x1="404" y1="360" x2="360" y2="404"/>
  </g>
</svg>
