<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10130F"/>
      <stop offset="1" stop-color="#070907"/>
    </linearGradient>
    <linearGradient id="green3" x1="90" y1="120" x2="420" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DFFAF"/>
      <stop offset="1" stop-color="#00C97D"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg3)"/>

  <!-- H: bracket-style, shifted left to make room -->
  <g fill="url(#green3)">
    <rect x="96" y="146" width="42" height="220" rx="9"/>
    <rect x="96" y="236" width="150" height="40" rx="8"/>
  </g>

  <!-- S: continuous ribbon stroke, reads as signal/routing path -->
  <path d="M 330 168
           C 288 168, 260 190, 260 220
           C 260 250, 288 256, 320 256
           C 352 256, 380 262, 380 292
           C 380 322, 352 344, 310 344"
        fill="none" stroke="url(#green3)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- x: small terminal cursor accent, bottom right -->
  <g stroke="#3DFFAF" stroke-width="20" stroke-linecap="round">
    <line x1="392" y1="378" x2="424" y2="410"/>
    <line x1="424" y1="378" x2="392" y2="410"/>
  </g>
</svg>
