actions:
  service:
    permission: system_services
    constraints:
      allowed_units: ["hsx-*"]
  apt_install:
    permission: install_packages
    constraints:
      allowed_packages: ["[A-Za-z0-9][A-Za-z0-9+_.-]*"]
  apt_remove:
    permission: install_packages
    constraints:
      allowed_packages: ["[A-Za-z0-9][A-Za-z0-9+_.-]*"]
  pip_install:
    permission: install_packages
    constraints:
      allowed_packages: ["[A-Za-z0-9][A-Za-z0-9+_.-]*"]
  disk_cleanup:
    permission: delete_owner_files
    constraints:
      allowed_targets: ["apt-cache", "old-logs", "outputs"]
  journal_read:
    constraints:
      allowed_units: ["hsx-*"]
  system_stats: {}
  network_status: {}
  tailscale_status: {}
  schedule_timer:
    permission: system_services
    constraints:
      allowed_names: ["hsx-*"]
  reboot:
    permission: shutdown_reboot
  wifi_reconnect: {}
