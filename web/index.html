<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <title>HSX · Workspace assistant</title>
    <link rel="stylesheet" href="/web/chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script defer src="/web/chat.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header id="status-header" class="status-header">
        <a class="brand" href="/" aria-label="HSX home">
          <span class="brand-mark">H</span>
          <span>HSX <span class="brand-subtitle">WORKSPACE</span></span>
        </a>
        <div class="connection-status"><span class="status-dot"></span><span id="connection-label">Connecting</span></div>
        <div class="telemetry" aria-label="Runtime telemetry">
          <div class="metric"><span class="metric-label">MODEL / PROVIDER</span><strong id="metric-provider">—</strong></div>
          <div class="metric"><span class="metric-label">ROUTER</span><strong id="metric-confidence">—</strong></div>
          <div class="metric"><span class="metric-label">TOKENS IN / OUT*</span><strong id="metric-tokens">0 / 0</strong></div>
          <div class="metric"><span class="metric-label">LATENCY</span><strong id="metric-latency">—</strong></div>
        </div>
      </header>
      <main class="conversation-layout">
        <section class="conversation-panel" aria-label="Conversation">
          <div id="chat-stream" class="message-stream" role="log" aria-live="polite" aria-relevant="additions text">
            <section class="welcome-card" id="welcome-card">
              <div class="welcome-kicker"><span class="status-dot"></span> LOCAL WORKSPACE READY</div>
              <h1>What can I help you with?</h1>
              <p>Ask a question, search your workspace, or create something new.</p>
              <div class="suggestions">
                <button class="suggestion" type="button" data-prompt="Show my workspace files">Browse workspace files</button>
                <button class="suggestion" type="button" data-prompt="Check system status">Check system status</button>
                <button class="suggestion" type="button" data-prompt="Search my notes">Search my notes</button>
              </div>
            </section>
          </div>
          <div class="composer-dock">
            <form id="composer-form" class="composer">
              <label class="sr-only" for="prompt-input">Message HSX</label>
              <textarea id="prompt-input" rows="1" placeholder="Message HSX…" autocomplete="off"></textarea>
              <div class="composer-actions">
                <div class="composer-hint"><kbd>Enter</kbd> to send <span>·</span> <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</div>
                <div class="button-row">
                  <button id="stop-button" class="button button-quiet" type="button" title="Stop the current task">Stop</button>
                  <button id="send-button" class="button button-primary" type="submit"><span>Send</span><span aria-hidden="true">↗</span></button>
                </div>
              </div>
            </form>
            <p class="privacy-note">Your prompts and files stay in your local workspace.</p>
          </div>
        </section>
      </main>
    </div>
    <template id="message-template">
      <article class="message-card">
        <div class="message-heading"><span class="avatar"></span><strong class="message-author"></strong><span class="message-time"></span></div>
        <div class="message-content markdown-body"></div>
        <div class="message-feedback" hidden>
          <span>Helpful?</span>
          <button type="button" class="feedback-button" data-feedback="good" aria-label="Good response" title="Good response">👍</button>
          <button type="button" class="feedback-button" data-feedback="bad" aria-label="Bad response" title="Bad response">👎</button>
          <span class="feedback-status" role="status"></span>
        </div>
      </article>
    </template>
    <template id="activity-template">
      <div class="activity-card" role="status"><span class="activity-spinner"></span><span></span></div>
    </template>
  </body>
</html>
