<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <title>Hsx</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8.5 8.5 0 1 0 10 10z"/></symbol>
    <symbol id="icon-panel" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M10 4v16M14 10l-2 2 2 2"/></symbol>
    <symbol id="icon-mic" viewBox="0 0 24 24"><rect x="9" y="4" width="6" height="11" rx="3"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v3M9 20h6"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24"><path d="m4 5 16 7-16 7 3-7zM7 12h13"/></symbol>
  </svg>

  <div class="app-shell" id="app-shell">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
      <div class="brand">
        <span class="brand-mark"><img src="favicon.svg" alt="Hsx" /></span>
        <span>Hsx</span>
      </div>

      <div class="rail-actions">
        <button class="rail-icon" id="theme-button" aria-label="Toggle theme" title="Toggle theme">
          <svg><use href="#icon-moon"/></svg>
        </button>
        <button class="rail-icon" id="collapse-button" aria-label="Close sidebar" title="Close sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="3.5"/>
            <line x1="9.5" y1="4" x2="9.5" y2="20"/>
            <path d="M15.5 10l-2 2 2 2"/>
          </svg>
        </button>
      </div>

      <button class="new-chat" id="new-chat">
        <span><svg><use href="#icon-plus"/></svg></span> New Chat
      </button>

      <nav class="nav-list" aria-label="Primary">
        <div class="sidebar-label">CHAT HISTORY</div>
      </nav>

      <div class="recent-list">
        <button class="recent-item active" data-recent="New Chat">New Chat</button>
      </div>

      <div class="sidebar-bottom">
        <div class="pipeline-status">
          <span class="pipeline-label">Backend Pipeline:</span>
          <span class="offline" id="pipeline-status"><span></span> Offline</span>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Content -->
    <main class="main-content">
      <!-- Full Sidebar Open/Toggle Button when collapsed -->
      <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Open sidebar" title="Open sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="3.5"/>
          <line x1="9.5" y1="4" x2="9.5" y2="20"/>
          <path d="M13.5 10l2 2-2 2"/>
        </svg>
      </button>

      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
      </header>

      <section class="conversation" aria-live="polite">
        <div class="welcome-block" id="welcome-block">
          <div class="welcome-mark" aria-hidden="true">
            <img src="favicon.svg" alt="Hsx" />
          </div>
          <h1 id="greeting-headline">One more thing before you’re done for the day?</h1>
          <p id="greeting-subtext">Hand it over and I'll get you the answer.</p>
        </div>

        <div class="messages" id="messages"></div>

        <div class="composer-wrap">
          <form class="composer" id="chat-form">
            <button type="button" class="tool-button attach-button" id="attach-button" title="Attach a file">
              <svg><use href="#icon-plus"/></svg>
            </button>
            <input id="file-input" type="file" hidden>

            <div class="input-container">
              <input
                id="message-input"
                name="message"
                type="text"
                placeholder="Ask about text, tables, or diagrams..."
                aria-label="Ask about text, tables, or diagrams"
                autocomplete="off"
              >
              <button type="button" class="mic-button" id="mic-button" aria-label="Voice input" title="Voice input">
                <svg><use href="#icon-mic"/></svg>
              </button>
            </div>

            <button class="send-button" type="submit" aria-label="Send message">
              <svg><use href="#icon-send"/></svg>
            </button>
          </form>

          <div class="composer-note">Made by HS</div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
